name: RDP Bridge

on:
  repository_dispatch:
    types: [RDP]
  workflow_dispatch:
    inputs:
      ip:
        description: 'Target Tailscale IP'
        required: true
      username:
        description: 'Target Windows Username'
        required: false
      password:
        description: 'Target Windows Password'
        required: false

jobs:
  RDP:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Install Dependencies
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list

          sudo apt-get update
          sudo apt-get install -y \
            tailscale xvfb freerdp2-x11 \
            pulseaudio alsa-utils libasound2-plugins \
            xdotool openbox x11-utils

      - name: Authenticate Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=linux-rdp-bridge-${{ github.run_id }} \
            --accept-routes
          sleep 3
          tailscale status || true

      - name: Resolve IP & Credentials
        run: |
          TARGET_IP="${{ github.event.client_payload.ip || inputs.ip }}"
          TARGET_USER="${{ github.event.client_payload.username || inputs.username || secrets.RDP_USER || 'Cloud PC' }}"
          TARGET_PASS="${{ github.event.client_payload.password || inputs.password || secrets.RDP_PASSWORD || '123456' }}"

          if [ -z "$TARGET_IP" ]; then
            echo "::error::TARGET_IP is empty"
            exit 1
          fi

          echo "TARGET_IP=$TARGET_IP"     >> $GITHUB_ENV
          echo "TARGET_USER=$TARGET_USER" >> $GITHUB_ENV
          echo "TARGET_PASS=$TARGET_PASS" >> $GITHUB_ENV

          echo "::add-mask::$TARGET_PASS"
          echo "::add-mask::$TARGET_USER"
          echo "Resolved target: $TARGET_IP"

      - name: Ping Windows host before starting
        run: |
          echo "Pinging $TARGET_IP ..."
          for i in $(seq 1 30); do
            if ping -c 1 -W 2 "$TARGET_IP" >/dev/null 2>&1; then
              echo "Host reachable on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Host $TARGET_IP not reachable via Tailscale"
          exit 1

      - name: Run RDP Session (finish on disconnect)
        run: |
          echo "Starting Xvfb + WM + single FreeRDP session..."

          # 1. Virtual display (1920x1080 to match login.py coordinates)
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR -nolisten tcp &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 3

          if ! xdpyinfo -display :99 >/dev/null 2>&1; then
            echo "::error::Xvfb failed to start"
            exit 1
          fi

          # 2. Window manager — REQUIRED so FreeRDP receives keyboard focus
          openbox --sm-disable --config-file /dev/null &
          WM_PID=$!
          sleep 2

          # 3. Audio
          pulseaudio --start --exit-idle-time=-1 >/dev/null 2>&1
          sleep 1

          # 4. Background keep-alive — sends a harmless key every 25 s
          (
            while true; do
              sleep 25
              xdotool key --clearmodifiers F15 >/dev/null 2>&1
            done
          ) &
          KEEP_PID=$!

          # Cleanup on exit
          cleanup() {
            echo "[$(date)] Cleaning up background processes..."
            kill $KEEP_PID $WM_PID $XVFB_PID >/dev/null 2>&1
          }
          trap cleanup EXIT

          echo "==========================================================="
          echo "[$(date)] Starting RDP session -> $TARGET_IP"
          echo "==========================================================="

          # 5. Single FreeRDP session — when it disconnects, we move on
          xfreerdp \
            /v:"$TARGET_IP" \
            /u:"$TARGET_USER" \
            /p:"$TARGET_PASS" \
            /size:1920x1080 \
            /bpp:32 \
            /gdi:hw \
            /rfx \
            /admin \
            /cert-ignore \
            /cert:ignore \
            +clipboard \
            /dynamic-resolution \
            /network:LAN \
            /sound:sys:pulse \
            /audio-mode:0 \
            /log-level:WARN \
            +async-update \
            +fonts \
            +aero || true

          RC=$?
          echo "[$(date)] RDP session disconnected (exit code $RC)."
          echo "Cleaning up and finishing job..."
          exit 0
