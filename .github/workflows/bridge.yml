name: RDP Bridge

on:
  repository_dispatch:
    types: [RDP]
  workflow_dispatch:
    inputs:
      ip:
        description: 'Target Tailscale IP'
        required: true
      username:
        description: 'Target Windows Username'
        required: false
      password:
        description: 'Target Windows Password'
        required: false

jobs:
  RDP:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Install Dependencies
        run: |
          set -e
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update

          sudo apt-get install -y \
            tailscale xvfb xdotool openbox x11-utils netcat-openbsd \
            alsa-utils libasound2-plugins

          if sudo apt-get install -y freerdp2-x11 2>/dev/null; then
            echo "Installed freerdp2-x11"
          else
            sudo apt-get install -y freerdp3-x11
            echo "Installed freerdp3-x11"
          fi

          if command -v xfreerdp >/dev/null 2>&1; then
            echo "RDP_BIN=xfreerdp" >> $GITHUB_ENV
          elif command -v xfreerdp3 >/dev/null 2>&1; then
            echo "RDP_BIN=xfreerdp3" >> $GITHUB_ENV
          else
            echo "::error::No xfreerdp binary found"
            exit 1
          fi

      - name: Authenticate Tailscale
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
                            --hostname=linux-rdp-bridge-${{ github.run_id }} \
                            --accept-routes
          sleep 3
          tailscale status || true

      - name: Resolve IP & Credentials
        run: |
          TARGET_IP="${{ github.event.client_payload.ip || inputs.ip }}"
          TARGET_USER="${{ github.event.client_payload.username || inputs.username || secrets.RDP_USER || 'Cloud PC' }}"
          TARGET_PASS="${{ github.event.client_payload.password || inputs.password || secrets.RDP_PASSWORD || '123456' }}"

          if [ -z "$TARGET_IP" ]; then
            echo "::error::TARGET_IP is empty"
            exit 1
          fi

          echo "TARGET_IP=$TARGET_IP"     >> $GITHUB_ENV
          echo "TARGET_USER=$TARGET_USER" >> $GITHUB_ENV
          echo "TARGET_PASS=$TARGET_PASS" >> $GITHUB_ENV

          echo "::add-mask::$TARGET_PASS"
          echo "::add-mask::$TARGET_USER"
          echo "Resolved target: $TARGET_IP"

      - name: Wait for host
        run: |
          echo "Waiting for $TARGET_IP ..."
          for i in $(seq 1 40); do
            if ping -c 1 -W 2 "$TARGET_IP" >/dev/null 2>&1 && nc -z -w 2 "$TARGET_IP" 3389 2>/dev/null; then
              echo "TCP 3389 open on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Host $TARGET_IP:3389 not reachable"
          exit 1

      - name: Run RDP Session (non-intrusive; waits long between attempts)
        run: |
          set +e

          # ================== CONFIG ==================
          # How long to wait between connection attempts (seconds).
          # HIGH value = bridge almost never touches your PC.
          #   - 60   = aggressive (what you had — kicked you every 30s)
          #   - 300  = safe (5 min between attempts)
          #   - 600  = very safe (10 min)
          RETRY_WAIT=300

          # Sessions shorter than this are considered "quick failures"
          # (e.g. Windows refused because you're already on).
          QUICK_FAIL_SECONDS=25
          # ============================================

          # 1. Virtual display
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR 2>/dev/null &
          XVFB_PID=$!
          export DISPLAY=:99
          export XKB_DEFAULT_RULES=
          sleep 3

          if ! xdpyinfo -display :99 >/dev/null 2>&1; then
            echo "::error::Xvfb failed to start"
            exit 1
          fi

          # 2. Window manager (quiet)
          openbox --sm-disable >/dev/null 2>&1 &
          WM_PID=$!
          sleep 2

          # 3. Keep-alive
          (
            while true; do
              sleep 20
              WIN=$(xdotool search --class "freerdp" 2>/dev/null | head -1)
              if [ -n "$WIN" ]; then
                xdotool windowactivate --sync "$WIN" >/dev/null 2>&1
                xdotool windowfocus   --sync "$WIN" >/dev/null 2>&1
              fi
              xdotool mousemove_relative --  1 0 >/dev/null 2>&1
              xdotool mousemove_relative -- -1 0 >/dev/null 2>&1
              xdotool key --clearmodifiers F15 >/dev/null 2>&1
            done
          ) &
          KEEP_PID=$!

          cleanup() {
            echo "[$(date)] Cleaning up..."
            kill $KEEP_PID $WM_PID $XVFB_PID >/dev/null 2>&1
          }
          trap cleanup EXIT

          # ---------- Helpers ----------
          host_reachable() {
            ping -c 1 -W 2 "$TARGET_IP" >/dev/null 2>&1 && \
            nc -z -w 2 "$TARGET_IP" 3389 2>/dev/null
          }

          RDP_LOG=/tmp/xfreerdp.log

          # Strict busy patterns only.
          BUSY_PATTERN="another user|already logged on|already logged in|session is in use|session is busy|device busy|maximum.*session|STATUS_DEVICE_BUSY|disconnected because another|disconnected by the (administrator|other user)"

          echo "=========================================="
          echo "[$(date)] RDP bridge -> $TARGET_IP"
          echo "Binary  : $RDP_BIN"
          echo "Retry   : ${RETRY_WAIT}s between attempts"
          echo "Policy  : If you are already on the PC, the bridge will"
          echo "          wait and will NOT keep probing every few seconds."
          echo "=========================================="

          # ================= PERSISTENT LOOP =================
          while true; do
            # A) Host reachable?
            if ! host_reachable; then
              echo "[$(date)] Host $TARGET_IP unreachable — waiting ${RETRY_WAIT}s"
              sleep $RETRY_WAIT
              continue
            fi

            # B) Attempt RDP.
            : > "$RDP_LOG"
            START_TS=$(date +%s)
            echo "[$(date)] Attempting RDP connection..."

            "$RDP_BIN" \
              /v:"$TARGET_IP" \
              /u:"$TARGET_USER" \
              /p:"$TARGET_PASS" \
              /size:1920x1080 \
              /bpp:32 \
              /cert-ignore \
              +clipboard \
              /network:LAN \
              /audio-mode:2 \
              /log-level:INFO \
              +async-update \
              +fonts >> "$RDP_LOG" 2>&1
            RC=$?
            END_TS=$(date +%s)
            DURATION=$((END_TS - START_TS))

            echo "[$(date)] xfreerdp exited (rc=$RC, ran ${DURATION}s)"

            # C) Classify the outcome
            if [ "$DURATION" -lt "$QUICK_FAIL_SECONDS" ]; then
              # Quick failure. Could be a busy refusal, or auth/network issue.
              if grep -qiE "$BUSY_PATTERN" "$RDP_LOG"; then
                echo "[$(date)] Another RDP client is on $TARGET_IP — NOT disturbing. Waiting ${RETRY_WAIT}s."
              else
                echo "[$(date)] Quick failure (rc=$RC). Last lines:"
                tail -n 10 "$RDP_LOG" || true
                echo "[$(date)] Waiting ${RETRY_WAIT}s before retry."
              fi
            else
              # A real session ran, then ended (you disconnected, network blip, etc.)
              echo "[$(date)] Session ran for ${DURATION}s then ended. Waiting ${RETRY_WAIT}s before re-checking."
            fi

            sleep $RETRY_WAIT
          done

          echo "[$(date)] RDP bridge finished."
          exit 0
