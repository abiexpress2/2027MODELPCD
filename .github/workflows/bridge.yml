name: RDP Bridge

on:
  repository_dispatch:
    types: [RDP]
  workflow_dispatch:
    inputs:
      ip:        { required: true }
      username:  { required: false }
      password:  { required: false }

jobs:
  RDP:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Install Dependencies
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update
          sudo apt-get install -y \
            tailscale xvfb freerdp2-x11 \
            pulseaudio alsa-utils libasound2-plugins \
            xdotool openbox x11-utils wmctrl netcat-openbsd

      - name: Authenticate Tailscale
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
                            --hostname=linux-rdp-bridge-${{ github.run_id }} \
                            --accept-routes
          sleep 3
          tailscale status || true

      - name: Resolve Credentials
        run: |
          TARGET_IP="${{ github.event.client_payload.ip || inputs.ip }}"
          TARGET_USER="${{ github.event.client_payload.username || inputs.username || 'Cloud PC' }}"
          TARGET_PASS="${{ github.event.client_payload.password || inputs.password || '123456' }}"
          [ -z "$TARGET_IP" ] && { echo "::error::no IP"; exit 1; }

          echo "TARGET_IP=$TARGET_IP"     >> $GITHUB_ENV
          echo "TARGET_USER=$TARGET_USER" >> $GITHUB_ENV
          echo "TARGET_PASS=$TARGET_PASS" >> $GITHUB_ENV
          echo "::add-mask::$TARGET_PASS"
          echo "::add-mask::$TARGET_USER"

      - name: Wait for host
        run: |
          for i in $(seq 1 60); do
            if ping -c 1 -W 2 "$TARGET_IP" >/dev/null 2>&1 && nc -z -w 2 "$TARGET_IP" 3389 2>/dev/null; then
              echo "RDP port open on attempt $i"; exit 0
            fi
            sleep 2
          done
          echo "::error::Host unreachable"; exit 1

      - name: Run RDP Session (persistent, with auto-reconnect)
        timeout-minutes: 345
        run: |
          set +e

          # ---------- 1. Virtual display ----------
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 3
          xdpyinfo -display :99 >/dev/null 2>&1 || { echo "::error::Xvfb failed"; exit 1; }

          # ---------- 2. Window manager ----------
          openbox --sm-disable &
          WM_PID=$!
          sleep 2

          # ---------- 3. Audio ----------
          pulseaudio --start --exit-idle-time=-1 >/dev/null 2>&1

          # ---------- 4. Keep-alive with WINDOW FOCUS ----------
          #    This is the critical difference from before:
          #    every tick, it finds the FreeRDP window, focuses it, then
          #    sends a mouse wiggle + harmless key. Without the focus step
          #    the keystrokes go nowhere and Windows disconnects the session.
          (
            while true; do
              sleep 20
              WIN=$(xdotool search --class "freerdp" 2>/dev/null | head -1)
              if [ -n "$WIN" ]; then
                xdotool windowactivate --sync "$WIN" >/dev/null 2>&1
                xdotool windowfocus   --sync "$WIN" >/dev/null 2>&1
              fi
              xdotool mousemove_relative --  1 0 >/dev/null 2>&1
              xdotool mousemove_relative -- -1 0 >/dev/null 2>&1
              xdotool key --clearmodifiers F15 >/dev/null 2>&1
            done
          ) &
          KEEP_PID=$!

          cleanup() {
            echo "[$(date)] cleanup..."
            kill $KEEP_PID $WM_PID $XVFB_PID >/dev/null 2>&1
          }
          trap cleanup EXIT

          # ---------- 5. Persistent FreeRDP loop with retry ----------
          ATTEMPT=0
          while true; do
            ATTEMPT=$((ATTEMPT+1))
            echo "=========================================="
            echo "[$(date)] xfreerdp attempt #$ATTEMPT -> $TARGET_IP"
            echo "=========================================="

            xfreerdp \
              /v:"$TARGET_IP" \
              /u:"$TARGET_USER" \
              /p:"$TARGET_PASS" \
              /size:1920x1080 \
              /bpp:32 \
              /gdi:hw \
              /rfx \
              /cert-ignore \
              +clipboard \
              /dynamic-resolution \
              /network:LAN \
              /sound:sys:pulse \
              /audio-mode:0 \
              /log-level:INFO \
              +async-update \
              +fonts \
              +aero \
              /timeout:60000

            RC=$?
            echo "[$(date)] xfreerdp exited (rc=$RC) — retry in 5s"
            sleep 5
          done
