name: RDP Bridge

on:
  repository_dispatch:
    types: [RDP]
  workflow_dispatch:
    inputs:
      ip:
        description: 'Target Tailscale IP'
        required: true
      username:
        description: 'Target Windows Username'
        required: false
      password:
        description: 'Target Windows Password'
        required: false

jobs:
  RDP:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Install Dependencies
        run: |
          set -e
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update

          sudo apt-get install -y \
            tailscale xvfb xdotool openbox x11-utils netcat-openbsd \
            alsa-utils libasound2-plugins

          if sudo apt-get install -y freerdp2-x11 2>/dev/null; then
            echo "Installed freerdp2-x11"
          else
            sudo apt-get install -y freerdp3-x11
            echo "Installed freerdp3-x11"
          fi

          if command -v xfreerdp >/dev/null 2>&1; then
            echo "RDP_BIN=xfreerdp" >> $GITHUB_ENV
          elif command -v xfreerdp3 >/dev/null 2>&1; then
            echo "RDP_BIN=xfreerdp3" >> $GITHUB_ENV
          else
            echo "::error::No xfreerdp binary found"
            exit 1
          fi

      - name: Authenticate Tailscale
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
                            --hostname=linux-rdp-bridge-${{ github.run_id }} \
                            --accept-routes
          sleep 3
          tailscale status || true

      - name: Resolve IP & Credentials
        run: |
          TARGET_IP="${{ github.event.client_payload.ip || inputs.ip }}"
          TARGET_USER="${{ github.event.client_payload.username || inputs.username || secrets.RDP_USER || 'Cloud PC' }}"
          TARGET_PASS="${{ github.event.client_payload.password || inputs.password || secrets.RDP_PASSWORD || '123456' }}"

          if [ -z "$TARGET_IP" ]; then
            echo "::error::TARGET_IP is empty"
            exit 1
          fi

          echo "TARGET_IP=$TARGET_IP"     >> $GITHUB_ENV
          echo "TARGET_USER=$TARGET_USER" >> $GITHUB_ENV
          echo "TARGET_PASS=$TARGET_PASS" >> $GITHUB_ENV

          echo "::add-mask::$TARGET_PASS"
          echo "::add-mask::$TARGET_USER"
          echo "Resolved target: $TARGET_IP"

      - name: Wait for host
        run: |
          echo "Waiting for $TARGET_IP ..."
          for i in $(seq 1 40); do
            if ping -c 1 -W 2 "$TARGET_IP" >/dev/null 2>&1 && nc -z -w 2 "$TARGET_IP" 3389 2>/dev/null; then
              echo "TCP 3389 open on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Host $TARGET_IP:3389 not reachable"
          exit 1

      - name: Run RDP Session (wait if another client holds the session)
        run: |
          set +e

          # ---------- 1. Virtual display ----------
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR 2>/dev/null &
          XVFB_PID=$!
          export DISPLAY=:99
          export XKB_DEFAULT_RULES=
          sleep 3

          if ! xdpyinfo -display :99 >/dev/null 2>&1; then
            echo "::error::Xvfb failed to start"
            exit 1
          fi

          # ---------- 2. Window manager (quiet) ----------
          openbox --sm-disable >/dev/null 2>&1 &
          WM_PID=$!
          sleep 2

          # ---------- 3. Keep-alive ----------
          (
            while true; do
              sleep 20
              WIN=$(xdotool search --class "freerdp" 2>/dev/null | head -1)
              if [ -n "$WIN" ]; then
                xdotool windowactivate --sync "$WIN" >/dev/null 2>&1
                xdotool windowfocus   --sync "$WIN" >/dev/null 2>&1
              fi
              xdotool mousemove_relative --  1 0 >/dev/null 2>&1
              xdotool mousemove_relative -- -1 0 >/dev/null 2>&1
              xdotool key --clearmodifiers F15 >/dev/null 2>&1
            done
          ) &
          KEEP_PID=$!

          cleanup() {
            echo "[$(date)] Cleaning up..."
            kill $KEEP_PID $WM_PID $XVFB_PID >/dev/null 2>&1
          }
          trap cleanup EXIT

          # ---------- Helpers ----------
          host_reachable() {
            ping -c 1 -W 2 "$TARGET_IP" >/dev/null 2>&1 && \
            nc -z -w 2 "$TARGET_IP" 3389 2>/dev/null
          }

          RDP_LOG=/tmp/xfreerdp.log

          # Only true "someone else is logged on / holding the session" messages.
          # NOTE: deliberately excludes "disconnected by the remote" — that also
          # appears on our own disconnects.
          BUSY_PATTERN="another user is logged|another user|already logged on|already logged in|already connected|session is in use|session is busy|device busy|maximum.*session|STATUS_DEVICE_BUSY|disconnected because another"

          # Sessions shorter than this are treated as instant refusals.
          MIN_SESSION_SECONDS=20

          echo "=========================================="
          echo "[$(date)] RDP bridge -> $TARGET_IP"
          echo "Binary  : $RDP_BIN"
          echo "Mode    : Always check for other RDP clients first."
          echo "          If someone else is connected -> wait 30s and retry."
          echo "          When free -> connect."
          echo "=========================================="

          # ================= PERSISTENT LOOP =================
          # Every iteration:
          #   1. Wait until host is reachable.
          #   2. Try an RDP session.
          #   3. If it exits very fast with a "busy" message -> another client
          #      is on the machine -> sleep 30s and retry.
          #   4. Otherwise (long session that ended) -> sleep 30s and retry.
          while true; do
            # A) Host reachable?
            if ! host_reachable; then
              echo "[$(date)] Host $TARGET_IP unreachable (ping/3389) — waiting 30s"
              sleep 30
              continue
            fi

            # B) Attempt RDP. This is both the "is it free?" probe AND the real
            #    session: if the machine is free, this connection succeeds and
            #    the script stays inside xfreerdp until the user disconnects.
            : > "$RDP_LOG"
            START_TS=$(date +%s)
            echo "[$(date)] Attempting RDP connection..."

            "$RDP_BIN" \
              /v:"$TARGET_IP" \
              /u:"$TARGET_USER" \
              /p:"$TARGET_PASS" \
              /size:1920x1080 \
              /bpp:32 \
              /cert-ignore \
              +clipboard \
              /network:LAN \
              /audio-mode:2 \
              /log-level:INFO \
              +async-update \
              +fonts >> "$RDP_LOG" 2>&1
            RC=$?
            END_TS=$(date +%s)
            DURATION=$((END_TS - START_TS))

            echo "[$(date)] xfreerdp exited (rc=$RC, ran ${DURATION}s)"

            # C) Short failure + busy message => someone else is on the machine
            if [ "$DURATION" -lt "$MIN_SESSION_SECONDS" ] && grep -qiE "$BUSY_PATTERN" "$RDP_LOG"; then
              echo "[$(date)] Another RDP client is connected to $TARGET_IP. Waiting 30s before next check..."
              sleep 30
              continue
            fi

            # D) Short failure without a busy message -> log tail + retry
            if [ "$DURATION" -lt "$MIN_SESSION_SECONDS" ]; then
              echo "[$(date)] Connection failed quickly (not a 'busy' error). Last log lines:"
              tail -n 20 "$RDP_LOG" || true
              echo "[$(date)] Retrying in 30s..."
              sleep 30
              continue
            fi

            # E) A real session ran and then ended -> user disconnected
            #    -> retry (which will re-check whether someone else takes it)
            echo "[$(date)] Session ended after ${DURATION}s. Re-checking in 30s..."
            sleep 30
          done

          echo "[$(date)] RDP bridge finished."
          exit 0
