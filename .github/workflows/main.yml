name: 2027 MODEL PCD

on:
  repository_dispatch:
    types: [2027MODELPCD]
  workflow_dispatch:

jobs:
  CloudPC:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Configure Core
        run: |
          # Set System Time Zone securely via Secret
          $tz = "${{ secrets.RDP_TIMEZONE }}"
          if (-not [string]::IsNullOrWhiteSpace($tz)) {
              Set-TimeZone -Id $tz
          }

          # Edge AutoLaunch Protocol Policy for Zoom
          $zoomOrigins = '[{"allowed_origins":["https://zoom.us","https://www.zoom.us","https://us02web.zoom.us","https://us03web.zoom.us","https://us04web.zoom.us","https://us05web.zoom.us","https://us06web.zoom.us","https://us07web.zoom.us","https://us08web.zoom.us","https://us09web.zoom.us","https://us10web.zoom.us","https://us11web.zoom.us","https://us12web.zoom.us","https://us13web.zoom.us","https://us14web.zoom.us","https://us15web.zoom.us","https://us16web.zoom.us","https://us17web.zoom.us","https://us18web.zoom.us","https://us19web.zoom.us","https://us20web.zoom.us"],"protocol":"zoommtg"}]'

          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Name 'AutoLaunchProtocolsFromOrigins' -Type String -Value $zoomOrigins -Force

          # Enable RDP & Firewall
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          # StickyKeys Adjustments
          $path = "HKCU:\Control Panel\Accessibility\StickyKeys"
          New-Item -Path $path -Force | Out-Null
          Set-ItemProperty -Path $path -Name "Flags" -Value "58" -Type String
          
          $path2 = "HKCU:\Control Panel\Accessibility\Keyboard Response"
          New-Item -Path $path2 -Force | Out-Null
          Set-ItemProperty -Path $path2 -Name "Flags" -Value "122" -Type String

          # Force Remote Desktop active display buffer
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MaxInstanceCount" -Value 100 -Force

          # Enable RDP Audio Redirection in Registry
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableCam" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableAudioCapture" -Value 0 -Force

          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $policyPath)) { New-Item -Path$policyPath -Force | Out-Null }
          Set-ItemProperty -Path $policyPath -Name "fDisableAudioCapture" -Value 0 -Type DWord -Force

          # Enable Windows Audio Services
          Set-Service -Name "AudioSrv" -StartupType Automatic
          Start-Service -Name "AudioSrv" -ErrorAction SilentlyContinue
          Set-Service -Name "AudioEndpointBuilder" -StartupType Automatic
          Start-Service -Name "AudioEndpointBuilder" -ErrorAction SilentlyContinue

          # Prevent power down or screen timeout
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change disk-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /change monitor-timeout-dc 0
          powercfg /change standby-timeout-dc 0

          # Restart TermService
          Restart-Service -Name TermService -Force

      - name: Create RDP User & Security Policies
        run: |
          $userName = "Cloud PC"
          $password = "123456"

          Write-Host "::add-mask::$password"
          Write-Host "::add-mask::$userName"

          # Disable local password complexity
          secedit /export /cfg "$env:TEMP\secpol.cfg"
          $cfgContent = Get-Content "$env:TEMP\secpol.cfg"
          $cfgContent = $cfgContent -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0'$cfgContent = $cfgContent -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0'$cfgContent = $cfgContent -replace 'LimitBlankPasswordUse = 1', 'LimitBlankPasswordUse = 0'$cfgContent | Out-File -Encoding ascii "$env:TEMP\secpol.cfg"
          secedit /configure /db "$env:TEMP\secpol.sdb" /cfg "$env:TEMP\secpol.cfg" /areas SECURITYPOLICY

          # Create Account
          $securePass = ConvertTo-SecureString$password -AsPlainText -Force
          New-LocalUser -Name $userName -Password$securePass -AccountNeverExpires -PasswordNeverExpires -ErrorAction SilentlyContinue
          net user "$userName" "$password"
          net user "$userName" /active:yes
          net user "$userName" /passwordchg:no

          Add-LocalGroupMember -Group "Administrators" -Member $userName -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $userName -ErrorAction SilentlyContinue

          # Kill lock screen / screensaver / inactivity timeout
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
          if (-not (Test-Path $policyPath)) { New-Item -Path$policyPath -Force | Out-Null }
          Set-ItemProperty -Path $policyPath -Name "NoLockScreen" -Value 1 -Type DWord -Force

          $saverPol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Control Panel\Desktop'
          New-Item -Path $saverPol -Force | Out-Null
          Set-ItemProperty -Path $saverPol -Name "ScreenSaveActive"    -Value "0" -Type String -Force
          Set-ItemProperty -Path $saverPol -Name "ScreenSaveTimeOut"   -Value "0" -Type String -Force
          Set-ItemProperty -Path $saverPol -Name "ScreenSaverIsSecure" -Value "0" -Type String -Force

          $sysPol = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
          if (-not (Test-Path $sysPol)) { New-Item -Path$sysPol -Force | Out-Null }
          Set-ItemProperty -Path $sysPol -Name "InactivityTimeoutSecs" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $sysPol -Name "DisableLockWorkstation" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $sysPol -Name "EnableFirstLogonAnimation" -Value 0 -Type DWord -Force

          # Session timeouts (0 = unlimited)
          $tsPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $tsPath)) { New-Item -Path$tsPath -Force | Out-Null }
          Set-ItemProperty -Path $tsPath -Name "MaxIdleTime"             -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "MaxDisconnectionTime"    -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "RemoteAppLogoffTimeout" -Value 0 -Type DWord -Force

          # AutoLogon configuration
          $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
          Set-ItemProperty -Path $winlogon -Name "AutoAdminLogon"  -Value "1"       -Force
          Set-ItemProperty -Path $winlogon -Name "DefaultUsername" -Value $userName -Force
          Set-ItemProperty -Path $winlogon -Name "DefaultPassword" -Value $password -Force
          Set-ItemProperty -Path $winlogon -Name "ForceAutoLogon"  -Value "1"       -Force
          Remove-ItemProperty -Path $winlogon -Name "AutoLogonCount" -ErrorAction SilentlyContinue

      - name: Install Virtual Display Driver (optional)
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'$ProgressPreference    = 'SilentlyContinue'

          $driverZip = "$env:TEMP\usbmmidd.zip"
          $driverDir = "C:\VirtualDisplay"
          New-Item -ItemType Directory -Path $driverDir -Force | Out-Null

          $urls = @(
              "https://github.com/roshkins/IddSampleDriver/raw/main/usbmmidd_v2.zip",
              "https://github.com/itsmikethetech/Virtual-Display-Driver/releases/download/v23.10.24/usbmmidd_v2.zip",
              "https://www.amyuni.com/downloads/usbmmidd_v2.zip"
          )

          $downloaded =$false
          foreach ($url in$urls) {
              try {
                  Write-Host "Trying $url ..."
                  [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                  Invoke-WebRequest -Uri $url -OutFile$driverZip -TimeoutSec 45 -UseBasicParsing
                  if ((Test-Path $driverZip) -and (Get-Item$driverZip).Length -gt 100000) {
                      $downloaded =$true
                      Write-Host "Downloaded successfully from $url"
                      break
                  }
              } catch {
                  Write-Warning "Failed $url : $($_.Exception.Message)"
              }
          }

          if (-not $downloaded) {
              Write-Warning "Virtual display driver unavailable — skipping."
              exit 0
          }

          Expand-Archive -Path $driverZip -DestinationPath$driverDir -Force -ErrorAction Stop
          $installer = Get-ChildItem -Path$driverDir -Recurse -Filter "deviceinstaller64.exe" | Select-Object -First 1

          if ($installer) {
              Set-Location $installer.DirectoryName
              & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd 2>&1 | Out-Host
              & .\deviceinstaller64.exe enableidd 1 2>&1 | Out-Host
          }

      - name: Install Software (OBS, Zoom, AutoHotkey & Python Packages)
        run: |
          winget source update
          winget install --id OBSProject.OBSStudio   --exact --source winget --accept-source-agreements --accept-package-agreements
          winget install --id Zoom.Zoom              -e      --source winget --accept-source-agreements --accept-package-agreements
          winget install --id AutoHotkey.AutoHotkey  --exact --source winget --accept-source-agreements --accept-package-agreements

          python -m pip install --upgrade pip
          pip install pynput pyautogui pygetwindow

      - name: Configure Cloud Directory & Auto Tasks
        env:
          LOGIN_URL:  ${{ secrets.LOGIN_URL }}
          LOGIN_TIME: ${{ secrets.LOGIN_TIME }}
          OBS_URL:    ${{ secrets.OBS_URL }}
          OBS_TIME:   ${{ secrets.OBS_TIME }}
          AHK_URL:    ${{ secrets.AHK_URL }}
          AHK_TIME:   ${{ secrets.AHK_TIME }}
        run: |
          New-Item -ItemType Directory -Path "C:\Cloud" -Force | Out-Null
          $rdpUser = "Cloud PC"

          $settings = New-ScheduledTaskSettingsSet `
              -AllowStartIfOnBatteries `
              -DontStopIfGoingOnBatteries `
              -StartWhenAvailable `
              -RestartCount 999 `
              -RestartInterval (New-TimeSpan -Minutes 1) `
              -ExecutionTimeLimit (New-TimeSpan -Hours 0)

          # Task setup helper function
          function Register-CloudTask ($url,$time, $fileName,$taskName, $exec,$args) {
              if (-not [string]::IsNullOrWhiteSpace($url) -and -not [string]::IsNullOrWhiteSpace($time)) {$dest = "C:\Cloud\$fileName"
                  Invoke-WebRequest -Uri $url -OutFile $dest$action    = New-ScheduledTaskAction -Execute $exec -Argument$args -WorkingDirectory "C:\Cloud"
                  $trigger   = New-ScheduledTaskTrigger -Daily -At$time
                  $triggerL  = New-ScheduledTaskTrigger -AtLogOn -User$rdpUser
                  $principal = New-ScheduledTaskPrincipal -UserId$rdpUser -LogonType Interactive -RunLevel Highest
                  Register-ScheduledTask -TaskName $taskName -Action$action -Trigger @($trigger,$triggerL) -Principal $principal -Settings$settings -Force
              }
          }

          Register-CloudTask $env:OBS_URL$env:OBS_TIME "obs.py" "OBSTask" "python" '"C:\Cloud\obs.py"'
          Register-CloudTask $env:LOGIN_URL$env:LOGIN_TIME "login.py" "LoginTask" "python" '"C:\Cloud\login.py"'
          Register-CloudTask $env:AHK_URL$env:AHK_TIME "auto.ahk" "AHKTask" "cmd.exe" '/c start "" "C:\Cloud\auto.ahk"'

      - name: Configure Direct Console Auto-Loop
        run: |
          $scriptContent = @'
          while ($true) {
              try {
                  $sessions = qwinsta 2>$null
                  $hasConsoleActive =$false
                  foreach ($line in$sessions) {
                      if ($line -match "^\s*\S+\s+(\d+)\s+Disc") {
                          $sid =$matches[1]
                          if ($sid -ne "0") {
                              cmd.exe /c "tscon $sid /dest:console" 2>$null
                          }
                      }
                      if ($line -match "^\s*console\s+(\d+)\s+Active") {
                          $hasConsoleActive =$true
                      }
                  }
                  if (-not $hasConsoleActive) {
                      Add-Content -Path "C:\Cloud\keepalive.log" -Value "[$(Get-Date)] No active console — rebooting"
                      cmd.exe /c "shutdown /r /t 0 /f" 2>$null
                      Start-Sleep -Seconds 120
                  }
              } catch {
                  Add-Content -Path "C:\Cloud\keepalive.log" -Value "[$(Get-Date)] EX:$_"
              }
              Start-Sleep -Seconds 5
          }
          '@

          $scriptPath = "C:\KeepScreenAlive.ps1"
          $scriptContent \vert{} Out-File -FilePath$scriptPath -Encoding utf8

          $action    = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-ExecutionPolicy Bypass -WindowStyle Hidden -File $scriptPath"
          $trigger   = New-ScheduledTaskTrigger -AtStartup$principal = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\SYSTEM" -LogonType ServiceAccount -RunLevel Highest

          Register-ScheduledTask -TaskName "KeepScreenAliveTask" -Action $action -Trigger $trigger -Principal$principal -Force
          Start-ScheduledTask -TaskName "KeepScreenAliveTask"

      - name: Install & Connect Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          curl.exe -sSL "$tsUrl" -o "$installerPath"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/qn", "/norestart" -Wait
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue | Start-Service -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          & "$tsExe" up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="gh-runner-$env:GITHUB_RUN_ID" --unattended

          for ($i = 1; $i -le 15; $i++) {$tsIP = (& "$tsExe" ip -4 2>$null).Trim()
              if ($tsIP -and $tsIP -match "^\d+\.\d+\.\d+\.\d+$") { break }
              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP assignment timed out."
              exit 1
          }

          Write-Host "Tailscale IP: $tsIP"
          "TAILSCALE_IP=$tsIP" \vert{} Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Send Credentials to Cloudflare Worker
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
        run: |
          $payload = @{
              address  = "$env:TAILSCALE_IP"
              username = "Cloud PC"
              password = "123456"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "$env:CF_WORKER_URL/webhook" -Method Post -Body $payload -ContentType "application/json"

      - name: Maintain Active Runner Loop & Trigger RDP Bridge
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          $headers = @{
              "Accept"                = "application/vnd.github+json"
              "Authorization"         = "Bearer $env:GH_PAT"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $body = @{
              event_type     = "RDP"
              client_payload = @{
                  ip       = "$env:TAILSCALE_IP"
                  username = "Cloud PC"
                  password = "123456"
              }
          } | ConvertTo-Json -Compress

          try {
              $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/dispatches"
              Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body$body -ContentType "application/json"
          } catch {
              Write-Warning "Failed to trigger dispatch event: $($_.Exception.Message)"
          }

          # Watchdog loop
          $totalSeconds   = 9000
          $elapsedSeconds = 0$heartbeatPath  = "C:\Cloud\login.heartbeat"

          while ($elapsedSeconds -lt$totalSeconds) {
              try {
                  if (Test-Path $heartbeatPath) {
                      $age = (Get-Date) - (Get-Item$heartbeatPath).LastWriteTime
                      if ($age.TotalMinutes -gt 10) {
                          Write-Host "[$(Get-Date)] login.py stalled — restarting LoginTask"
                          Restart-ScheduledTask -TaskName "LoginTask" -ErrorAction SilentlyContinue
                          (Get-Date).ToString() | Out-File -FilePath $heartbeatPath -Encoding utf8
                      }
                  }
              } catch {
                  Write-Warning "Watchdog error: $($_.Exception.Message)"
              }

              Start-Sleep -Seconds 300
              $elapsedSeconds += 300
          }

      - name: Clear Cloudflare Worker
        if: always()
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
        run: |
          try {
              $body = @{ reason = "workflow-stopped" } | ConvertTo-Json
              Invoke-RestMethod -Uri "$env:CF_WORKER_URL/clear" -Method Post -Body $body -ContentType "application/json"
          } catch {
              Write-Warning "Failed to clear KV: $($_.Exception.Message)"
          }
