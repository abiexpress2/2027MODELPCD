name: 2027 MODEL PCD

on:
  repository_dispatch:
    types: [2027MODELPCD]
  workflow_dispatch:

jobs:
  CloudPC:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Configure Core
        run: |
          # Set System Time Zone securely via Secret
          $tz = "${{ secrets.RDP_TIMEZONE }}"
          if (-not [string]::IsNullOrWhiteSpace($tz)) {
              Set-TimeZone -Id $tz
          }

          # Edge AutoLaunch Protocol Policy for Zoom (Expanded Origins)
          $zoomOrigins = '[{"allowed_origins":["https://zoom.us","https://www.zoom.us","https://us02web.zoom.us","https://us03web.zoom.us","https://us04web.zoom.us","https://us05web.zoom.us","https://us06web.zoom.us","https://us07web.zoom.us","https://us08web.zoom.us","https://us09web.zoom.us","https://us10web.zoom.us","https://us11web.zoom.us","https://us12web.zoom.us","https://us13web.zoom.us","https://us14web.zoom.us","https://us15web.zoom.us","https://us16web.zoom.us","https://us17web.zoom.us","https://us18web.zoom.us","https://us19web.zoom.us","https://us20web.zoom.us"],"protocol":"zoommtg"}]'

          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Name 'AutoLaunchProtocolsFromOrigins' -Type String -Value $zoomOrigins -Force

          # Enable RDP & Firewall
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          Set-ItemProperty -Path "HKCU:\Control Panel\Accessibility\StickyKeys" -Name "Flags" -Value "506"
          $path = "HKCU:\Control Panel\Accessibility\StickyKeys"
          New-Item -Path $path -Force | Out-Null
          Set-ItemProperty -Path $path -Name "Flags" -Value "58" -Type String
          $path2 = "HKCU:\Control Panel\Accessibility\Keyboard Response"
          New-Item -Path $path2 -Force | Out-Null
          Set-ItemProperty -Path $path2 -Name "Flags" -Value "122" -Type String

          # Force Remote Desktop active display buffer
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MaxInstanceCount" -Value 100 -Force

          # Enable RDP Audio Redirection in Registry
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableCam" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableAudioCapture" -Value 0 -Force

          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }
          Set-ItemProperty -Path $policyPath -Name "fDisableAudioCapture" -Value 0 -Type DWord -Force

          # Enable Windows Audio Services
          Set-Service -Name "AudioSrv" -StartupType Automatic
          Start-Service -Name "AudioSrv" -ErrorAction SilentlyContinue
          Set-Service -Name "AudioEndpointBuilder" -StartupType Automatic
          Start-Service -Name "AudioEndpointBuilder" -ErrorAction SilentlyContinue

          # Prevent power down or screen timeout
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change disk-timeout-ac 0

          # Restart TermService
          Restart-Service -Name TermService -Force

      - name: Create RDP User & Security Policies
        run: |
          $userName = "Cloud PC"
          $password = "123456"

          Write-Host "::add-mask::$password"
          Write-Host "::add-mask::$userName"

          # Disable local password complexity
          secedit /export /cfg "$env:TEMP\secpol.cfg"
          $cfgContent = Get-Content "$env:TEMP\secpol.cfg"
          $cfgContent = $cfgContent -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0'
          $cfgContent = $cfgContent -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0'
          $cfgContent | Out-File -Encoding ascii "$env:TEMP\secpol.cfg"
          secedit /configure /db "$env:TEMP\secpol.sdb" /cfg "$env:TEMP\secpol.cfg" /areas SECURITYPOLICY

          # Create Account
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $userName -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          net user "$userName" "$password"

          Add-LocalGroupMember -Group "Administrators" -Member $userName -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $userName -ErrorAction SilentlyContinue

          # Infinite session duration & disable lock screen
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsPersonalization'
          if (-not (Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }
          Set-ItemProperty -Path $policyPath -Name "NoLockScreen" -Value 1 -Type DWord -Force

          $tsPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $tsPath)) { New-Item -Path $tsPath -Force | Out-Null }
          Set-ItemProperty -Path $tsPath -Name "MaxIdleTime" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "MaxDisconnectionTime" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "RemoteAppLogoffTimeout" -Value 0 -Type DWord -Force

      - name: Install Virtual Display Driver
        run: |
          # --- Install Virtual Display Driver ---
          $driverZip = "$env:TEMP\usbmmidd.zip"
          $driverDir = "C:\VirtualDisplay"
          New-Item -ItemType Directory -Path $driverDir -Force | Out-Null

          $urls = @(
              "https://raw.githubusercontent.com/roshkins/IddSampleDriver/main/usbmmidd_v2.zip",
              "https://www.amyuni.com/downloads/usbmmidd_v2.zip"
          )

          foreach ($url in $urls) {
              try {
                  [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                  curl.exe -sSL "$url" -o "$driverZip"
                  if ((Test-Path $driverZip) -and (Get-Item $driverZip).Length -gt 1000) { break }
              } catch {}
          }

          if (Test-Path $driverZip) {
              Expand-Archive -Path $driverZip -DestinationPath $driverDir -Force
              $installer = Get-ChildItem -Path $driverDir -Recurse -Filter "deviceinstaller64.exe" | Select-Object -First 1
              if ($installer) {
                  Set-Location $installer.DirectoryName
                  & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd
                  & .\deviceinstaller64.exe enableidd 1
              }
          }

      - name: Install Software (OBS, Zoom, AutoHotkey & Python Packages)
        run: |
          winget source update
          winget install --id OBSProject.OBSStudio --exact --source winget --accept-source-agreements --accept-package-agreements
          winget install --id Zoom.Zoom -e --source winget --accept-source-agreements --accept-package-agreements
          winget install --id AutoHotkey.AutoHotkey --exact --accept-source-agreements --accept-package-agreements

          # Install Python & required packages
          python -m pip install --upgrade pip
          pip install pynput pyautogui

      - name: Configure Cloud Directory & Auto Tasks
        env:
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          LOGIN_TIME: ${{ secrets.LOGIN_TIME }}
          OBS_URL: ${{ secrets.OBS_URL }}
          OBS_TIME: ${{ secrets.OBS_TIME }}
          AHK_URL: ${{ secrets.AHK_URL }}
          AHK_TIME: ${{ secrets.AHK_TIME }}
        run: |
          New-Item -ItemType Directory -Path "C:\Cloud" -Force | Out-Null
          $rdpUser = "Cloud PC"

          # Global Settings: allow running on battery, don't stop, and run as soon as possible if missed
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -ExecutionTimeLimit (New-TimeSpan -Hours 12)

          # --- 1. Download and Schedule OBS Task (obs.py) ---
          if (-not [string]::IsNullOrWhiteSpace($env:OBS_URL) -and -not [string]::IsNullOrWhiteSpace($env:OBS_TIME)) {
              $obsFile = "obs.py"
              $obsDest = "C:\Cloud\$obsFile"
              $obsName = "OBSTask"

              Write-Host "Downloading OBS Script: $env:OBS_URL -> $obsDest"
              try {
                  Invoke-WebRequest -Uri $env:OBS_URL -OutFile $obsDest
                  $action  = New-ScheduledTaskAction -Execute "python" -Argument "`"$obsDest`"" -WorkingDirectory "C:\Cloud"
                  $trigger = New-ScheduledTaskTrigger -Daily -At $env:OBS_TIME
                  $principal = New-ScheduledTaskPrincipal -UserId $rdpUser -LogonType Interactive -RunLevel Highest
                  Register-ScheduledTask -TaskName $obsName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force
                  Write-Host "Successfully registered OBS Task '$obsName' at $env:OBS_TIME"
              } catch {
                  Write-Warning "Failed setting up OBS Task: $($_.Exception.Message)"
              }
          }

          # --- 2. Download and Schedule LOGIN Task (login.py) ---
          if (-not [string]::IsNullOrWhiteSpace($env:LOGIN_URL) -and -not [string]::IsNullOrWhiteSpace($env:LOGIN_TIME)) {
              $loginFile = "login.py"
              $loginDest = "C:\Cloud\$loginFile"
              $loginName = "LoginTask"

              Write-Host "Downloading Login Script: $env:LOGIN_URL -> $loginDest"
              try {
                  Invoke-WebRequest -Uri $env:LOGIN_URL -OutFile $loginDest
                  $action  = New-ScheduledTaskAction -Execute "python" -Argument "`"$loginDest`"" -WorkingDirectory "C:\Cloud"
                  $trigger = New-ScheduledTaskTrigger -Daily -At $env:LOGIN_TIME
                  $principal = New-ScheduledTaskPrincipal -UserId $rdpUser -LogonType Interactive -RunLevel Highest
                  Register-ScheduledTask -TaskName $loginName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force
                  Write-Host "Successfully registered Login Task '$loginName' at $env:LOGIN_TIME"
              } catch {
                  Write-Warning "Failed setting up Login Task: $($_.Exception.Message)"
              }
          }

          # --- 3. Download and Schedule AHK Task (auto.ahk) ---
          if (-not [string]::IsNullOrWhiteSpace($env:AHK_URL) -and -not [string]::IsNullOrWhiteSpace($env:AHK_TIME)) {
              $ahkFile = "auto.ahk"
              $ahkDest = "C:\Cloud\$ahkFile"
              $ahkName = "AHKTask"

              Write-Host "Downloading AHK Script: $env:AHK_URL -> $ahkDest"
              try {
                  Invoke-WebRequest -Uri $env:AHK_URL -OutFile $ahkDest
                  $action  = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c start `"`" `"$ahkDest`"" -WorkingDirectory "C:\Cloud"
                  $trigger = New-ScheduledTaskTrigger -Daily -At $env:AHK_TIME
                  $principal = New-ScheduledTaskPrincipal -UserId $rdpUser -LogonType Interactive -RunLevel Highest
                  Register-ScheduledTask -TaskName $ahkName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force
                  Write-Host "Successfully registered AHK Task '$ahkName' ($ahkDest) at $env:AHK_TIME"
              } catch {
                  Write-Warning "Failed setting up AHK Task: $($_.Exception.Message)"
              }
          }

      - name: Configure Direct Console Auto-Loop
        run: |
          $scriptContent = @'
          while ($true) {
              $output = qwinsta
              foreach ($line in $output) {
                  if ($line -match "disc\s+(\d+)") {
                      $sessionId = $matches[1]
                      if ($sessionId -ne "0") {
                          cmd.exe /c "tscon $sessionId /dest:console" 2>$null
                      }
                  }
              }
              Start-Sleep -Seconds 5
          }
          '@

          $scriptPath = "C:\KeepScreenAlive.ps1"
          $scriptContent | Out-File -FilePath $scriptPath -Encoding utf8

          $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-ExecutionPolicy Bypass -WindowStyle Hidden -File $scriptPath"
          $trigger = New-ScheduledTaskTrigger -AtStartup
          $principal = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\SYSTEM" -LogonType ServiceAccount -RunLevel Highest

          Register-ScheduledTask -TaskName "KeepScreenAliveTask" -Action $action -Trigger $trigger -Principal $principal -Force
          Start-ScheduledTask -TaskName "KeepScreenAliveTask"

      - name: Install & Connect Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          curl.exe -sSL "$tsUrl" -o "$installerPath"

          $process = Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/qn", "/norestart" -Wait -PassThru
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"

          $timeout = 0
          while (-not (Test-Path $tsExe) -and $timeout -lt 30) {
              Start-Sleep -Seconds 2
              $timeout += 2
          }

          if (-not (Test-Path $tsExe)) {
              Write-Error "Tailscale executable was not found."
              exit 1
          }

          Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue | Start-Service -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          & "$tsExe" up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="gh-runner-$env:GITHUB_RUN_ID" --unattended

          $tsIP = ""
          for ($i = 1; $i -le 15; $i++) {
              $tsIP = (& "$tsExe" ip -4 2>$null).Trim()
              if ($tsIP -and $tsIP -match "^\d+\.\d+\.\d+\.\d+$") { break }
              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP assignment timed out."
              exit 1
          }

          Write-Host "Tailscale IP assigned successfully: $tsIP"
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Send Credentials to Cloudflare Worker Webhook
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
        run: |
          $payload = @{
              address = "$env:TAILSCALE_IP"
              username = "Cloud PC"
              password = "123456"
          } | ConvertTo-Json
          
          Invoke-RestMethod -Uri "$env:CF_WORKER_URL/webhook" -Method Post -Body $payload -ContentType "application/json"

          
      - name: Maintain Active Runner Loop & Trigger RDP Bridge
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          $rdpUser = "Cloud PC"
          $rdpPass = "123456"

          Write-Host "`n======================================================="
          Write-Host "RDP ACCESS READY"
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : $rdpUser"
          Write-Host "Password : [PROTECTED]"
          Write-Host "=======================================================\n"

          # Trigger bridge.yml using native PowerShell Invoke-RestMethod
          $headers = @{
              "Accept"               = "application/vnd.github+json"
              "Authorization"        = "Bearer $env:GH_PAT"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $body = @{
              event_type     = "RDP"
              client_payload = @{
                  ip       = "$env:TAILSCALE_IP"
                  username = "$rdpUser"
                  password = "$rdpPass"
              }
          } | ConvertTo-Json -Compress

          Write-Host "Triggering Linux RDP Bridge workflow (bridge.yml)..."
          try {
              $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/dispatches"
              Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body $body -ContentType "application/json"
              Write-Host "Successfully dispatched repository_dispatch event to bridge.yml"
          } catch {
              Write-Warning "Failed to trigger dispatch event: $($_.Exception.Message)"
          }

          # Run loop for 2 hours and 30 minutes (9000 seconds), then complete cleanly
          $totalSeconds = 9000
          $elapsedSeconds = 0

          while ($elapsedSeconds -lt $totalSeconds) {
              Write-Host "[$(Get-Date)] RDP & Virtual Engine Active ($elapsedSeconds / $totalSeconds seconds)..."
              Start-Sleep -Seconds 300
              $elapsedSeconds += 300
          }

          Write-Host "Completing workflow successfully."
          exit 0
